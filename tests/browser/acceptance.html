<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>acceptance</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body>
<div id="test-root"></div>
<pre id="result">running</pre>
<script type="module">
const out = [];
let finished = false;
const render = () => { if (finished) document.querySelector('#result').textContent = out.join('\n') + '\nRESULT: ' + (out.some(l => l.startsWith('FAIL')) ? 'FAIL' : 'PASS'); };
const log = (ok, msg) => { out.push(`${ok ? 'PASS' : 'FAIL'} ${msg}`); render(); };
const errorText = error => error?.stack || String(error);
window.addEventListener('error', event => log(false, `window.error: ${errorText(event.error || event.message)}`));
window.addEventListener('unhandledrejection', event => log(false, `unhandledrejection: ${errorText(event.reason)}`));
const originalError = console.error.bind(console);
console.error = (...args) => { log(false, `console.error: ${args.map(errorText).join(' ')}`); originalError(...args); };
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];
const click = element => { if (!element) throw Error('Missing click target'); element.click(); };
const visible = element => !!element && !element.hidden && getComputedStyle(element).display !== 'none' && element.getClientRects().length > 0;
let mounted;
let previousSave;
let saveKey;
try {
  const { CONFIG } = await import('/src/data/config.ts');
  const { createInitialState } = await import('/src/state/create-state.ts');
  const { TECHNOLOGIES } = await import('/src/data/technologies.ts');
  const { RESOURCES, CRAFT_RECIPES } = await import('/src/data/resources.ts');
  const { calculateCraftingMultiplier } = await import('/src/simulation/crafting.ts');
  const { calculateProduction } = await import('/src/simulation/production.ts');
  const { signedRate } = await import('/src/simulation/resource-breakdown.ts');
  const { nextTick } = await import('vue');
  const flush = async () => { await nextTick(); await sleep(30); };
  saveKey = CONFIG.saveKey;
  previousSave = localStorage.getItem(saveKey);
  localStorage.removeItem(saveKey);
  // No #app exists during import: main's automatic entry cannot mount this test twice.
  const { mountGame } = await import('/src/main.ts');
  mounted = mountGame($('#test-root'));
  const { app, store } = mounted;
  app.config.errorHandler = (error, instance, info) => log(false, `Vue runtime error (${info}): ${errorText(error)}`);
  $('#test-root').id = 'app';
  const S = () => store.runtime.state;
  await flush();
  const { uiPreview } = await import('/src/vue/preview-cache.ts');
  const initialPreview=uiPreview.production(S(),store.revision());
  log(initialPreview===uiPreview.production(S(),store.revision()),'同一界面版本共享生产快照');
  store.mutate(state=>{state.resources.wood+=1;});await flush();
  log(initialPreview!==uiPreview.production(S(),store.revision()),'真实状态操作后界面预览立即失效');
  store.mutate(state=>{state.resources.wood-=1;});await flush();
  log($('#app').hasAttribute('data-v-app') && $$('.app').length === 1, 'Vue 应用仅挂载一次');
  log(S().logs.filter(row => row.text.includes('第一只猫猫登陆')).length === 1, '新游戏欢迎日志仅一条');
  log([...document.styleSheets].some(sheet => sheet.href?.endsWith('/assets/css/style.css') && sheet.cssRules.length > 0), '真实应用样式已加载');
  const responsiveFrame = document.createElement('iframe');
  responsiveFrame.style.cssText = 'position:fixed;left:-10000px;height:200px;border:0';
  responsiveFrame.srcdoc = '<link rel="stylesheet" href="/assets/css/style.css"><div class="layout"><div></div><div></div><div class="col-right"></div></div>';
  const responsiveLoaded = new Promise(resolve => { responsiveFrame.onload = resolve; });
  document.body.append(responsiveFrame); await responsiveLoaded;
  for (const width of [860, 860.5, 861]) {
    responsiveFrame.style.width = `${width}px`; await flush();
    const columns = responsiveFrame.contentWindow.getComputedStyle(responsiveFrame.contentDocument.querySelector('.layout')).gridTemplateColumns.split(' ').length;
    log(columns === (width <= 860 ? 1 : 2), `布局在${width}px使用正确列数，无860/861小数视口断点空档`);
  }
  responsiveFrame.remove();
  const uiCss = [...document.styleSheets].find(sheet => sheet.href?.endsWith('/assets/css/style.css'));
  log([...uiCss.cssRules].some(rule => rule.selectorText?.includes('.q-row:focus-visible') && rule.selectorText.includes('.res-amount[tabindex]:focus-visible') && rule.style.outlineStyle === 'solid'), '队列行与可聚焦资源数量提供明确focus-visible轮廓');
  for (const id of ['food', 'wood', 'stone']) log(visible($(`[data-resource-id="${id}"]`)), `初始资源 ${id} 可见`);
  const allLogsButton = $('[data-log-filter="all"]');
  const idleLogStyle = getComputedStyle($('[data-log-filter="system"]'));
  log(allLogsButton.getAttribute('aria-pressed') === 'true' && getComputedStyle(allLogsButton).backgroundColor !== idleLogStyle.backgroundColor && getComputedStyle(allLogsButton).borderBottomStyle === 'solid', '日志默认筛选有可见背景边框和aria-pressed，不依赖文字颜色');
  const logSnapshot = S().logs.slice();
  store.mutate(state => { state.logs = [{ time: 1, text: '重复日志', type: 'system' }, { time: 1, text: '重复日志', type: 'system' }]; }); await flush();
  const duplicateNodes = $$('.log-line');
  click($('[data-log-filter="system"]')); await flush();
  log($$('.log-line').length === 2 && duplicateNodes.every((node, index) => node === $$('.log-line')[index]) && $('[data-log-filter="system"]').getAttribute('aria-pressed') === 'true', '同时间同文字日志不冲突，切换筛选保留各自DOM身份');
  store.mutate(state => { state.logs.unshift({ time: 2, text: '较新日志', type: 'system' }); }); await flush();
  log(duplicateNodes.every((node, index) => node === $$('.log-line')[index + 1]), '插入日志不会重用其他日志节点');
  store.mutate(state => { state.logs = logSnapshot; }); click(allLogsButton); await flush();
  log(!$('[data-resource-id="iron"]'), '初始铁资源未解锁');
  log(!visible($('[data-tab="resourceManagement"]')), '开局无集装箱上限或数量时隐藏资源管理');
  store.mutate(state => { state.containers = 1; }); await flush();
  log(visible($('[data-tab="resourceManagement"]')), '已有集装箱即使无上限仍显示资源管理');
  store.mutate(state => { state.containers = 0; state.buildings.massEjector = 1; }); await flush();
  click($('[data-tab="resourceManagement"]')); await flush();
  log(!$('[data-resource-view="containers"]') && $('[data-resource-view="massEjection"]').classList.contains('active'), '仅质量喷射解锁时隐藏集装箱且默认显示喷射页');
  store.mutate(state => { state.buildings.massEjector = 0; }); await flush();
  log(!visible($('[data-tab="resourceManagement"]')) && $('[data-tab="buildings"]').classList.contains('active'), '资源管理失去解锁条件后回退世界');
  log($$('.res-rate').length > 0 && $$('.res-rate').every(row => row.textContent.trim() && !/NaN|undefined/.test(row.textContent)), '资源速率均非空且有效');

  // Change plain state while staying on the same building panel.
  log(!$('[data-buy="nest"]'), '未解锁时猫窝不可见');
  store.mutate(state => { state.tech.push('survival'); });
  await flush();
  log(!!$('[data-buy="nest"]'), '原建筑面板立即显示新解锁猫窝');
  const hotkeySnapshot = JSON.parse(JSON.stringify(S()));
  const loseQueueKey = async (panel, visibility) => {
    click($(`[data-tab="${panel}"]`)); await flush();
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'q' }));
    if (visibility) {
      Object.defineProperty(document, 'hidden', { configurable: true, value: true });
      document.dispatchEvent(new Event('visibilitychange'));
      delete document.hidden;
    } else window.dispatchEvent(new Event('blur'));
    await flush();
  };
  for (const visibility of [false, true]) {
    store.mutate(state => { Object.assign(state, JSON.parse(JSON.stringify(hotkeySnapshot))); state.settings.paused = true; state.settings.queueHotkeys = true; Object.assign(state.resources, { wood: 100, stone: 100, cash: 100, knowledge: 100, food: 100 }); });
    await loseQueueKey('buildings', visibility);
    click($('[data-buy="nest"]')); await flush();
    log(S().buildings.nest === 1 && !S().queue.length, `建筑Q键${visibility ? '页面隐藏' : '窗口失焦'}后清除，资源足够直接购买`);
    await loseQueueKey('tech', visibility);
    click($('[data-research="tools"]')); await flush();
    log(S().tech.includes('tools') && !S().queue.length, `科技Q键${visibility ? '页面隐藏' : '窗口失焦'}后清除，资源足够直接研究`);
  }
  store.mutate(state => { Object.assign(state, hotkeySnapshot); }); await flush();
  click($('[data-tab="buildings"]')); await flush();
  store.mutate(state => { state.tech = []; state.resources.food = 10; });
  await flush();
  click($('[data-tab="tech"]')); await flush();
  click($('[data-research="survival"]')); await flush();
  log(S().tech.includes('survival'), '通过按钮完成基础生存研究');
  log(!$('[data-research="survival"]') && !!$('[data-research="tools"]'), '同科技面板移除已研究按钮并新增后续科技');

  click($('[data-tab="buildings"]')); await flush();
  click($('[data-buy="nest"]')); await flush();
  log(S().queue.some(item => item.kind === 'build' && item.id === 'nest'), '材料不足点击建筑进入购买队列');
  const cancel = $('[data-cancel-queue]');
  log(!!cancel, '购买队列提供取消按钮');
  log(!!$('[data-queue-time]')?.textContent.trim(), '队列项目显示预计完成时间或等待原因');
  $('.q-row[data-building-tip="nest"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' })); await flush();
  log($('#gameTooltip h3').textContent === '猫窝' && $('#gameTooltip').textContent.includes('建筑效果'), '队列建筑悬停复用建筑按钮详情');
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await flush();
  if (cancel) { click(cancel); await flush(); log(S().queue.length === 0, '取消按钮实际移除队列项'); }
  click($('[data-buy="nest"]')); await flush();
  store.mutate(state => { state.resources.wood = 30; state.resources.stone = 20; state.resources.cash = 20; });
  await sleep(250);
  store.runtime.tick(.2); store.refresh(); await flush();
  log(S().buildings.nest === 1 && S().queue.length === 0, '补充真实建造资源后 tick 完成队列购买');
  log($('[data-buy="nest"] .building-count')?.textContent.trim() === '1', '同建筑面板更新已建数量');

  log($('[data-tab="statistics"]').nextElementSibling === $('[data-tab="story"]'), '剧情主标签紧邻统计右侧');
  click($('[data-tab="statistics"]')); await flush();
  const achievementTab = $$('.tabs button').find(button => button.textContent.trim() === '成就');
  click(achievementTab); await flush();
  log($$('[data-achievement]').length === 7 && $('[data-achievement-filter="all"]').getAttribute('aria-pressed') === 'true', '成就默认显示全部七项新成就');
  store.mutate(state => { state.achievements = ['nuclearCuriosity']; }); await flush();
  click($('[data-achievement-filter="complete"]')); await flush();
  log($$('[data-achievement]').length === 1 && !!$('[data-achievement="nuclearCuriosity"]') && getComputedStyle($('[data-achievement-filter="complete"]')).borderTopColor === 'rgb(99, 184, 117)', '已完成筛选仅显示已获成就，按钮绿色边框');
  click($('[data-achievement-filter="incomplete"]')); await flush();
  log($$('[data-achievement]').length === 6 && !$('[data-achievement="nuclearCuriosity"]'), '未完成筛选隐藏已获成就');
  store.mutate(state => { state.achievements = []; }); await flush();
  click($('[data-statistics-view="perks"]')); await flush();
  log(!!$('.perk-list .empty') && !$('[data-perk]'), '无CRISPR时特权页显示空状态');
  const perkSnapshot = JSON.parse(JSON.stringify(S().crispr));
  store.mutate(state => { state.crispr = ['materialEfficiency', 'innovativeMaterials', 'architect']; }); await flush();
  log(!$('[data-perk="materialEfficiency"]') && !!$('[data-perk="innovativeMaterials"]') && $('[data-perk="architect"] .perk-name').textContent.includes('建筑师'), '特权页只显示覆盖链最高级并列出独立CRISPR效果');
  log(getComputedStyle($('[data-perk="architect"]')).borderTopStyle === 'solid' && $('[data-perk="innovativeMaterials"] .perk-current')?.textContent.includes('0.02'), '特权卡片带边框并显示当前实际数值');
  store.mutate(state => { state.crispr = perkSnapshot; }); await flush();
  click($('[data-tab="buildings"]')); await flush();
  log(S().story.unlocked.includes('firstShelter') && !!$('[data-story-unread-count]'), '建成首座猫窝自动收录剧情并显示未读数量');
  click($('[data-tab="story"]')); await flush();
  log($$('[data-story-phase]').length === 3 && $$('[data-story-chapter]').length === 17, '文明档案保留八章并增加第三阶段九章');
  log(!$('[data-story-open="anotherMind"]') && !$('#app').textContent.includes('AI超级核心的最后一段结构'), '未解锁章节隐藏正文及标题');
  log(getComputedStyle($('.story-locked')).opacity === '1' && getComputedStyle($('.story-locked')).color === 'rgb(170, 165, 143)', '锁定剧情使用清晰的主题弱化色，不再降低整行透明度');
  click($('[data-story-open="firstShelter"]')); await flush();
  log($('[data-story-text="firstShelter"]').textContent.includes('第一座猫窝没有名字') && S().story.read.includes('firstShelter'), '展开剧情立即显示正文并标记已读');
  log(JSON.parse(localStorage.getItem(CONFIG.saveKey)).story.read.includes('firstShelter'), '剧情已读状态即时持久化');
  log($$('[data-story-appendix]').length === 5 && !$('[data-story-open="firstEscape"]') && !$('#app').textContent.includes('确认发射的指令终于传遍ESS'), '五篇非线性附录独立展示且未收录内容隐藏');
  store.mutate(state => { state.buildings.forage = 1; state.population = 1; state.resources.food = 20; });
  click($('[data-tab="cats"]')); await flush();
  const plus = $('[data-worker="forage"][data-delta="1"]');
  click(plus); await flush();
  log(S().workers.forage === 1, '猫猫分配按钮实际增加工人');
  log(/^1\s*\//.test(plus.closest('.workers').querySelector('.worker-count').textContent.trim()), '同猫猫面板立即更新工人数量');

  // Queue hover prices follow current same-building ordinals, not stable uids.
  const queuePriceSnapshot = JSON.parse(JSON.stringify(S()));
  const showQueuePrice = async uid => { $(`[data-queue-uid="${uid}"]`).dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' })); await flush(); };
  const hideQueuePrice = async () => { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await flush(); };
  const { describeQueuedPurchases: queuedQuotes } = await import('/src/simulation/purchases.ts');
  const { fmt: queuePriceNumber } = await import('/src/vue/format.ts');
  store.mutate(state => {
    state.settings.paused = true;
    state.queue = [901, 902, 903, 904].map(uid => ({ uid, kind: 'build', id: 'nest' }));
  }); await flush();
  const originalQuotes = queuedQuotes(S());
  for (const quote of originalQuotes) {
    await showQueuePrice(quote.uid);
    log(Object.entries(quote.cost).every(([id, amount]) => $$('#gameTooltip .tip-cost').some(row => row.textContent === `${RESOURCES[id].name} ${queuePriceNumber(amount)}`)), `队列${quote.uid}悬停按同类前序数量递增价格`);
    await hideQueuePrice();
  }
  click($('[data-cancel-queue="902"]')); await flush();
  const remainingRows = $$('[data-queue-uid]').filter(row => row.dataset.tipKind === 'building');
  log(remainingRows.map(row => row.dataset.queueUid).join(',') === '901,903,904' && remainingRows.every((row, index) => row.querySelector('.q-top span').textContent.startsWith(`${index + 1}.`)), '删除第2项后第3和第4项显示编号顺延为2和3');
  await showQueuePrice(903);
  log(Object.entries(originalQuotes[1].cost).every(([id, amount]) => $$('#gameTooltip .tip-cost').some(row => row.textContent === `${RESOURCES[id].name} ${queuePriceNumber(amount)}`)), '原第3项悬停价格顺延为原第2项价格');
  await hideQueuePrice();
  store.mutate(state => { Object.assign(state, queuePriceSnapshot); }); await flush();

  // Automation UI is independent of manual assignments and uses only idle cats.
  const autoSnapshot = JSON.parse(JSON.stringify(S()));
  store.mutate(state => { state.population = 5; state.buildings.forage = 10; state.buildings.school = 10; if (!state.tech.includes('writing')) state.tech.push('writing'); }); await flush();
  log(!$('[data-auto-worker="forage"]'), '自动分配默认关闭并隐藏岗位配置');
  click($('[data-auto-workers-toggle]')); await flush();
  log(!!$('[data-auto-worker="forage"]') && !$('[data-auto-worker="lumber"]'), '总开关打开后显示有限岗位自动设置，不显示无限岗位');
  const autoLimit = $('[data-auto-worker-limit="forage"]');
  autoLimit.value = '2'; autoLimit.dispatchEvent(new Event('input', { bubbles: true })); autoLimit.dispatchEvent(new Event('change', { bubbles: true })); await flush();
  click($('[data-auto-worker="forage"]')); await flush();
  log(S().workers.forage === 2 && S().autoWorkers.jobs.forage.limit === 2, '岗位自动开关立即补员至设定上限');
  const prioritySchool = $('[data-auto-priority="school"]'), priorityForage = $('[data-auto-priority="forage"]');
  const dragData = new DataTransfer();
  prioritySchool.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: dragData }));
  priorityForage.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: dragData }));
  await flush();
  log($$('[data-auto-priority]')[0].dataset.autoPriority === 'school' && S().autoWorkers.priority[0] === 'forage', '拖动中实时预览新排序但松手前不修改实际优先级');
  priorityForage.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dragData })); await flush();
  log($('[data-auto-worker="forage"]').textContent === '自动分配' && getComputedStyle($('[data-auto-worker="forage"]')).borderTopColor === 'rgb(99, 184, 117)', '自动分配按钮使用固定文字和设置页同款绿色开启边框');
  log(S().autoWorkers.priority.indexOf('school') < S().autoWorkers.priority.indexOf('forage'), '拖拽优先级列表调整岗位顺序');
  const committedPriority = JSON.stringify(S().autoWorkers.priority);
  priorityForage.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: dragData }));
  prioritySchool.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: dragData })); await flush();
  priorityForage.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dragData })); await flush();
  log(JSON.stringify(S().autoWorkers.priority) === committedPriority && $$('[data-auto-priority]')[0].dataset.autoPriority === 'school', '取消拖拽恢复已保存顺序，不改变自动分配优先级');
  click($('[data-auto-workers-toggle]')); await flush();
  log(!S().autoWorkers.enabled && !$('[data-auto-worker="forage"]'), '关闭总开关停止自动分配并隐藏配置');
  store.mutate(state => { Object.assign(state, autoSnapshot); }); await flush();

  // Real-time date refresh, without remounting or changing tabs.
  store.mutate(state => { state.time = 4; }); await flush();
  const beforeDate = $('.game-date').textContent;
  await sleep(1200); store.runtime.tick(.2); store.refresh(); await flush();
  log($('.game-date').textContent !== beforeDate, '游戏日期随 tick 推进更新');

  // Add complete technology prerequisites; do not create invalid save fixtures.
  store.mutate(state => {
    const seen = new Set(state.tech);
    const add = id => { if (seen.has(id)) return; for (const prerequisite of TECHNOLOGIES[id].pre) add(prerequisite); seen.add(id); };
    add('spaceflight'); state.tech = [...seen];
  });
  click($('[data-tab="buildings"]')); await flush();
  click($('[data-world-view="space"]')); await flush();
  log($('[data-world-view="space"]')?.classList.contains('active') && !$('[data-gather]'), '点击太空实际切换世界视图');
  click($('[data-world-view="home"]')); await flush();
  log(visible($('[data-gather="wood"]')), '点击地面返回采集视图');

  click($('[data-tab="internal"]')); await flush();
  log(!!$('#taxRateInput') && !!$('#openGovernmentReform'), '内部管理税收和改革按钮存在');
  const taxPausedBefore = S().settings.paused, taxRateBefore = S().taxRate;
  store.mutate(state => { state.settings.paused = true; });
  $('#taxRateInput').value = '21'; $('#taxRateInput').dispatchEvent(new Event('input', { bubbles: true })); await flush();
  log(S().taxRate === 21 && JSON.parse(localStorage.getItem(saveKey)).taxRate === 21, '暂停时调整税率立即持久保存，不依赖后续tick或其他操作');
  store.mutate(state => { state.taxRate = taxRateBefore; state.settings.paused = taxPausedBefore; }); await flush();
  click($('[data-internal-view="military"]')); await flush();
  log(document.body.textContent.includes('士兵管理'), '军事分类可以切换');
  log($('[data-soldier-training-cap]')?.textContent.includes('完整支付维护') && $('[data-soldier-training-cap]')?.textContent.includes('停机不移除已有士兵'), '军事UI区分拥有容量和维护支持的训练容量，不误称停机删除士兵');

  const showTip = async (selector, focus = false) => {
    const element = $(selector);
    if (!element) throw Error(`Missing tooltip anchor ${selector}`);
    if (focus) element.focus();
    else element.dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' }));
    await flush();
  };
  const escapeTip = async () => { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await flush(); };
  const logUiSnapshot = JSON.parse(JSON.stringify(S().logs));
  store.mutate(state => { state.logs = ['queue', 'event', 'progress', 'achievement', 'system'].map(type => ({ time: 0, type, text: `日志可读性测试-${type}` })); }); await flush();
  const logColors = $$('.log-line').map(row => getComputedStyle(row).color);
  log(logColors.length === 5 && new Set(logColors).size === 5 && $$('.log-line').every(row => parseFloat(getComputedStyle(row).fontSize) >= 14), '五类日志独立配色且正文字号至少14px');
