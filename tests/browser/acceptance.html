// Classic script on purpose: a module that fails to *parse* never runs its own handlers, which
// used to leave this page stuck at "running" with no visible reason. Registering here means any
// syntax error, uncaught throw or rejected promise still paints a diagnosable result.
window.__fatal = message => {
  window.__fatalMessages = [...(window.__fatalMessages || []), String(message)];
  const paint = () => {
    const out = document.querySelector('#result');
    if (out) out.textContent = `FAIL 异常：${window.__fatalMessages.join(' | ')}\nRESULT: FAIL`;
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);
  else paint();
};
window.addEventListener('error', event => window.__fatal(event.error?.stack || `${event.message} @ ${event.filename}:${event.lineno}:${event.colno}`));
window.addEventListener('unhandledrejection', event => window.__fatal(event.reason?.stack || event.reason));
</script>
</head>

const errorText = error => error?.stack || String(error);

window.addEventListener('unhandledrejection', event => log(false, `unhandledrejection: ${errorText(event.reason)}`));

      $('[data-buy="quantizedCompressionModule"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' })); await flush();
      const compressionTip = $('#gameTooltip').textContent;
      log((compressionTip.match(/知识容量/g) || []).length === 1 && compressionTip.includes('110k'), '量化压缩提示只显示一次知识容量并包含有效解码器加成');
      await escapeTip();
      log(!$('[data-building-group="memory"]') && !$('[data-building-group="npu"]'), '深入核心前隐藏Memory和NPU');
      store.mutate(state => {
        state.tech.push('deepCore', 'cryptocurrency', 'encryptedDataAnalysis');
        state.buildings.cellCore = 4; state.buildings.memoryCore = 1;
        state.buildings.ethMiner = 1; state.buildings.dataDecryptionModule = 2;
        state.buildings.solarSatellite = 2000;
      }); await flush();
      log($$('[data-building-group]').map(el => el.dataset.buildingGroup).join(',') === 'ethernet,interface,qssd,cpu,memory,npu', '深入核心按CPU、Memory、NPU顺序扩展区域');
      log($('[data-region-description="memory"]').textContent.includes('她的记忆中只有你.......') && $('[data-region-description="npu"]').textContent.includes('我看到了她的意识和心灵'), 'Memory与NPU区域描述正确');
      log($('[data-building-group="cpu"]').contains($('[data-buy="cellCore"]')) && $('[data-building-group="cpu"]').contains($('[data-buy="dataDecryptionModule"]')) && $('[data-building-group="memory"]').contains($('[data-buy="memoryCore"]')) && $('[data-building-group="npu"]').contains($('[data-buy="ethMiner"]')), '核心、记忆、解密和矿机位于正确区域');
      $('[data-buy="memoryCore"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' })); await flush();
      log($('#gameTooltip').textContent.includes('加密数据容量') && $('#gameTooltip').textContent.includes('25k'), '解锁加密数据后记忆核心显示额外加密存储');
      await escapeTip();
      $('[data-buy="ethMiner"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' })); await flush();
      const minerRows = $$('#gameTooltip .resource-factor');
      log(minerRows.some(row => row.firstElementChild?.textContent === RESOURCES.cash.name && row.querySelector('.resource-factor-value')?.textContent === '+512/s')
        && minerRows.some(row => row.firstElementChild?.textContent === '现金容量' && row.querySelector('.resource-factor-value')?.textContent === '+512k')
        && !$('#gameTooltip .rate-note'), `矿机资金提示保留现金基础产量与容量且无供能备注: ${minerRows.map(row => row.textContent).join('|')}`);
      await escapeTip();
      log($('[data-digital-cpu]').textContent.includes('9 / 16'), `两座解密模块各占2CPU，数字世界算力使用合计9/16: ${$('[data-digital-cpu]').textContent}`);
      store.mutate(state => {
        state.tech.push('cellMultithreading', 'softRoutingNode', 'aes114514', 'digitalSimulation', 'highPrecisionWorldSimulation', 'agi', 'digitalAscension');
        state.buildings.softRouterNode = 2;
        state.buildings.aesComputeModule = 1;
        state.buildings.worldSimulator = 1;
        state.buildings.agiCoreComponent = 1;
        state.buildings.agiCoreComponentSegments = 0;
        state.buildings.agiAscensionCore = 1;
        state.buildings.agiAscensionCoreSegments = 0;
        state.stoppedBuildings.agiAscensionCore = 1;
        state.buildings.solarSatellite = 200000;
        state.resources.water = 1000000;
      }); await flush();
      log($('[data-building-group="ethernet"]').contains($('[data-buy="softRouterNode"]')) && $('[data-building-group="npu"]').contains($('[data-buy="aesComputeModule"]')) && $('[data-building-group="npu"]').contains($('[data-buy="worldSimulator"]')), '软路由位于Ethernet，AES与世界模拟器位于NPU');
      log($$('[data-building-group]').at(-1)?.dataset.buildingGroup === 'agi-core' && $('[data-region-description="agi-core"]').textContent.includes('"Hikarier.Execute"的内心世界'), 'AI超级核心区域位于NPU之后且说明正确');
      log($('[data-buy="agiAscensionCore"] .building-count').textContent === '1' && !$('[data-digital-ascension]'), '完整飞升核心显示1并关闭时隐藏飞升按钮');
      const stoppedCore = $('[data-buy="agiAscensionCore"]');
      const stoppedCoreRect = stoppedCore.getBoundingClientRect();
      const coreControl = stoppedCore.closest('.building-control');
      log(coreControl.querySelector('.building-toggle.stop').textContent === '1' && coreControl.querySelector('.building-toggle.start').textContent === '0', '分段核心开关使用完整单位而非分段数量');
      $('[data-buy="aesComputeModule"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' })); await flush();
      log($$('#gameTooltip .resource-factor').filter(row => row.firstElementChild?.textContent === '知识产量').length === 1, 'AES算力模块知识加成只显示一次');
      await escapeTip();
      $('[data-buy="softRouterNode"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' })); await flush();
      log($$('#gameTooltip .resource-factor').some(row => row.firstElementChild?.textContent === RESOURCES.energy.name && row.querySelector('.resource-factor-value')?.textContent === '-10'), '软路由节点提示电力消耗10（固定占用，不带/s）');
      await escapeTip();
      $('[data-buy="agiCoreComponent"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' })); await flush();
      log($('#gameTooltip').textContent.includes('量子水平') && $('#gameTooltip').textContent.includes('字节产量') && $('#gameTooltip').textContent.includes('+50%'), 'AGI组件提示展示量子水平与字节产量+50%效果');
      await escapeTip();
      store.mutate(state => { state.stoppedBuildings.agiAscensionCore = 0; }); await flush();
      const ascension = $('[data-digital-ascension]');
      const ascensionControl = ascension?.closest('.building-control');
      const coreRect = $('[data-buy="agiAscensionCore"]').getBoundingClientRect();
      const ascensionRect = ascension?.getBoundingClientRect();
      log(!!ascension && ascensionControl && ascensionControl.previousElementSibling === coreControl && ascensionControl.parentElement === coreControl.parentElement,
        '数字化飞升是核心右侧同网格的独立建筑按钮');
      const sameRowRight = Math.abs(ascensionRect.top - coreRect.top) < 1 && ascensionRect.left > coreRect.right - 1;
      const nextRowStart = ascensionRect.top > coreRect.bottom + 1;
      log(sameRowRight || nextRowStart, `飞升按钮与核心同尺寸，同行右侧或自然换行到下一行 ${JSON.stringify({ a: ascensionRect, c: coreRect })}`);
      log(Math.abs(coreRect.width - stoppedCoreRect.width) < 1 && Math.abs(coreRect.height - stoppedCoreRect.height) < 1,
        `核心供电后按钮形状不变（尺寸与停止时一致） ${JSON.stringify({ before: stoppedCoreRect, after: coreRect })}`);
      log(!!ascension && !ascension.querySelector('.building-count') && !ascension.querySelector('.building-pending'),
        '飞升按钮不显示建筑数量或预约角标');
      await showTip('[data-digital-ascension]');
      log($('#gameTooltip').textContent.includes('粒子') && $('#gameTooltip').textContent.includes('和谐晶体'), '飞升悬停显示粒子与和谐晶体奖励');
      await escapeTip();
      const gear = $('[data-download-settings]'); const building = $('[data-buy="downloadExecutable"]');
      const gearRect = gear?.getBoundingClientRect(); const buildingRect = building?.getBoundingClientRect();
      log(gear && gear.textContent === '⚙' && gear.classList.contains('building-gear') && gearRect && buildingRect && Math.abs(gearRect.left - buildingRect.left) < 5 && Math.abs(gearRect.top - buildingRect.top) < 5, 'dl.exe复用工厂齿轮图标并位于建筑按钮左上角');
      click(ascension); await flush();
      log(S().prestige.ascensionResets === 1 && S().buildings.agiAscensionCore === 0, '点击飞升立即执行数字化飞升重置');
      log(!!$('[data-prestige-row="harmonyCrystals"]') && $('[data-prestige-row="harmonyCrystals"] b')?.textContent === String(S().prestige.harmonyCrystals) && S().prestige.harmonyCrystals > 0, '飞升获得的和谐晶体显示在威望资源列表且数量正确');
      await showTip('[data-prestige-row="harmonyCrystals"] [data-tip-kind="prestige"]');
      const { calculateHarmonyCreepReduction } = await import('/src/simulation/costs.ts');
      const { formatEffectNumber, formatResourceNumber } = await import('/src/shared/format.ts');
      const harmonyEffectText = () => `当前已生效${formatResourceNumber(S().prestige.harmonyCrystals)}个和谐水晶，地面之外的建筑成本蠕变-${formatEffectNumber(calculateHarmonyCreepReduction(S()))}`;
      log($('#gameTooltip .tip-desc')?.textContent === harmonyEffectText() && !$('#gameTooltip .resource-factor') && !$('#gameTooltip').textContent.includes('累计获取') && !$('#gameTooltip').textContent.includes('飞升次数'), '和谐水晶数字悬停只显示按真实公式计算的效果，不显示历史统计');
      store.mutate(state => { state.prestige.harmonyCrystals = 50; }); await flush();
      log($('#gameTooltip .tip-desc')?.textContent === '当前已生效50个和谐水晶，地面之外的建筑成本蠕变-0.0069', '和谐水晶悬停随持有量更新，减免为蠕变系数而非百分比');
      store.mutate(state => { state.prestige.harmonyCrystals = 0; }); await flush();
      log(!!$('[data-prestige-row="harmonyCrystals"]') && $('#gameTooltip .tip-desc')?.textContent === '当前已生效0个和谐水晶，地面之外的建筑成本蠕变-0', '和谐水晶归零保留已解锁行且悬停效果归零');
      await escapeTip();
    } finally {
      if ($('#downloadModal [aria-label="关闭下载配置"]')) click($('#downloadModal [aria-label="关闭下载配置"]'));
      await escapeTip();
      store.mutate(state => Object.assign(state, digitalSnapshot)); await flush();
    }
  }
  // 资源明细弹窗：长数值不能被折成两行，而应把弹窗撑宽（玩家反馈的 UI 问题）。
  {
    // 构造 TooltipPanel 的等价标记，避免依赖某个存档里恰好有超长数值。
    const tip = document.createElement('div');
    tip.className = 'building-tooltip resource-detail';
    tip.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden';
    const row = (name, value) => `<div class="resource-factor"><span>${name}</span><span class="resource-factor-value is-negative">${value}</span></div>`;
    tip.innerHTML = '<h3>知识收支</h3><div class="resource-columns">'
      + '<div class="resource-column"><div class="resource-column-title">来源与产量倍率</div>'
      + row('猫猫教授', '+122/s') + row('粒子', '+1373.67%') + row('图书馆', '+350%') + '</div>'
      + '<div class="resource-column"><div class="resource-column-title">消耗</div>'
      + row('基因合成', '−9430.05/s') + '</div></div>';
    document.body.append(tip);
    await flush();
    const valueCell = tip.querySelectorAll('.resource-factor-value')[3];
    const valueStyle = getComputedStyle(valueCell);
    const lineHeight = parseFloat(valueStyle.lineHeight);
    const valueHeight = valueCell.getBoundingClientRect().height;
    log(valueStyle.whiteSpace === 'nowrap' && valueHeight <= lineHeight * 1.5,
      `资源明细长数值不换行 [whiteSpace=${valueStyle.whiteSpace}, h=${Math.round(valueHeight)}, lineH=${lineHeight.toFixed(1)}]`);
    // 短内容时弹窗收缩到内容宽度，不能留出大块空白（玩家第二次反馈的问题）。
    // 判据：弹窗内容盒宽度 - 两列实际占用宽度 <= padding + gap 级别的误差。
    const base = tip.getBoundingClientRect();
    const basePad = parseFloat(getComputedStyle(tip).paddingLeft) + parseFloat(getComputedStyle(tip).paddingRight);
    const columnsWidth = tip.querySelector('.resource-columns').getBoundingClientRect().width;
    const slack = Math.round(base.width - basePad - columnsWidth);
    log(slack <= 2,
      `资源明细弹窗不留空白 [tipW=${Math.round(base.width)}, columnsW=${Math.round(columnsWidth)}, slack=${slack}]`);
    // 塞入超长名称与数值后，弹窗必须变宽而不是折行。
    tip.querySelector('.resource-column:last-child .resource-factor span').textContent = '基因合成（加速批次全部产物）';
    tip.querySelectorAll('.resource-factor-value')[3].textContent = '−9430999.054321/s';
    await flush();
    const grown = Math.round(tip.getBoundingClientRect().width);
    const grownValue = tip.querySelectorAll('.resource-factor-value')[3].getBoundingClientRect();
    log(grown > Math.round(base.width) && grownValue.height <= lineHeight * 1.5,
      `内容更长时弹窗变宽而非折行 [${Math.round(base.width)} → ${grown}, valueH=${Math.round(grownValue.height)}]`);
    // 变宽后同样不能留空白。
    const grownPad = parseFloat(getComputedStyle(tip).paddingLeft) + parseFloat(getComputedStyle(tip).paddingRight);
    const grownSlack = Math.round(tip.getBoundingClientRect().width - grownPad - tip.querySelector('.resource-columns').getBoundingClientRect().width);
    log(grownSlack <= 2,
      `变宽后仍无空白 [slack=${grownSlack}]`);
    // 变宽不能突破视口。
    log(tip.getBoundingClientRect().right <= innerWidth,
      `资源明细弹窗不超出视口 [right=${Math.round(tip.getBoundingClientRect().right)}, viewport=${innerWidth}]`);
    tip.remove();
  }
  // 滚轮边界：列表内的滚轮到顶/到底都不把滚动交给页面（需要真实脚本环境，故在主页面验证）。
  {
    const list = $('[data-isolated-scroll]');
    if (!list) {
      log(false, '资源面板未渲染，无法验证滚轮边界');
    } else {
      const originalMaxHeight = list.style.maxHeight;
      list.style.maxHeight = '80px';
      await flush();
      const pageBefore = document.scrollingElement.scrollTop;
      list.scrollTop = list.scrollHeight;
      const pastEnd = new WheelEvent('wheel', { deltaY: 120, bubbles: true, cancelable: true });
      list.dispatchEvent(pastEnd);
      await flush();
      log(pastEnd.defaultPrevented && document.scrollingElement.scrollTop === pageBefore,
        `列表到底后不把滚动交给页面 [prevented=${pastEnd.defaultPrevented}, page ${pageBefore}→${document.scrollingElement.scrollTop}]`);
      list.scrollTop = 0;
      const pastTop = new WheelEvent('wheel', { deltaY: -120, bubbles: true, cancelable: true });
      list.dispatchEvent(pastTop);
      await flush();
      log(pastTop.defaultPrevented && document.scrollingElement.scrollTop === pageBefore,
        `列表到顶后同样不把滚动交给页面 [prevented=${pastTop.defaultPrevented}]`);
      list.style.maxHeight = originalMaxHeight;
      list.scrollTop = 0;
      await flush();
    }
  }
  // 左栏统一滚动（beta 0.9.25）：资源列表、锻造物与威望资源共用一个滚动容器，
  // 一起滚动；资源列表本身永远完整展开、不被裁剪成一小块。
  // 用独立 iframe 在真实宽度下验证布局本身，完全不依赖主应用当前标签页与状态。
  {
    const scroller = document.createElement('div');
    scroller.style.cssText = 'position:fixed;left:-10000px;top:0;width:1500px;height:800px;border:0;overflow:hidden';
    const frame = document.createElement('iframe');
    frame.style.cssText = 'width:1500px;height:800px;border:0';
    const rows = (n, cls) => Array.from({ length: n }, (_, i) => '<div class="res-row">' + cls + i + '</div>').join('');
    frame.srcdoc = '<link rel="stylesheet" href="/assets/css/style.css">'
      + '<div class="layout">'
      + '<aside class="col-left pinned-column">'
      + '<div class="panel" style="height:90px">head</div>'
      + '<div class="col-left-scroll isolated-scroll" data-isolated-scroll>'
      + '<section class="panel resource-panel" id="probeResources">' + rows(40, 'res') + '</section>'
      + '<section class="panel" id="probeCrafting" style="height:300px">crafting</section>'
      + '<section class="panel" id="probePrestige" style="height:200px">prestige</section>'
      + '</div></aside>'
      + '<main class="col-mid" style="height:2400px"></main><aside class="col-right"></aside></div>';
    scroller.append(frame);
    document.body.append(scroller);
    await new Promise(resolve => { frame.onload = resolve; });
    const fdoc = frame.contentDocument, fwin = frame.contentWindow;
    const col = fdoc.querySelector('.col-left');
    const box = fdoc.querySelector('.col-left-scroll');
    const resource = fdoc.querySelector('#probeResources');
    const crafting = fdoc.querySelector('#probeCrafting');
    const prestige = fdoc.querySelector('#probePrestige');
    const page = fdoc.scrollingElement;

    // 三块内容都在同一个滚动容器里。
    log([resource, crafting, prestige].every(el => el && box.contains(el)),
      '资源列表锻造物与威望资源共用一个滚动容器');

    // 左列固定在视口内，高度锁定。
    log(fwin.getComputedStyle(col).position === 'sticky' && Math.round(col.getBoundingClientRect().height) <= 801,
      `宽屏下左列固定且高度锁定在视口内 [position=${fwin.getComputedStyle(col).position}, h=${Math.round(col.getBoundingClientRect().height)}]`);

    // 滚动容器自己可滚（内容多于可视高度）。
    log(box.scrollHeight > box.clientHeight + 1,
      `左栏内容超出可视高度产生滚动条 [content=${box.scrollHeight}, client=${box.clientHeight}]`);

    // 资源列表完整展开：没有自己的滚动条，也没有被裁剪。
    log(fwin.getComputedStyle(resource).overflowY !== 'auto'
      && Math.abs(resource.scrollHeight - resource.clientHeight) <= 1
      && fwin.getComputedStyle(resource).maxHeight === 'none',
      `资源列表始终完整展开不折叠 [overflow-y=${fwin.getComputedStyle(resource).overflowY}, scroll=${resource.scrollHeight}, client=${resource.clientHeight}]`);

    // 滚动容器时三块内容一起移动，位移量相同。
    const top = el => Math.round(el.getBoundingClientRect().top);
    const before = { resource: top(resource), crafting: top(crafting), prestige: top(prestige) };
    box.scrollTop = 300;
    await flush();
    const after = { resource: top(resource), crafting: top(crafting), prestige: top(prestige) };
    const shifts = [before.resource - after.resource, before.crafting - after.crafting, before.prestige - after.prestige];
    log(box.scrollTop > 0 && shifts.every(shift => shift === shifts[0]) && shifts[0] > 0,
      `三块内容一起滚动 [位移=${shifts.join(',')}, scrollTop=${box.scrollTop}]`);

    // 左栏滚动不影响页面位置。
    const pageBefore = page.scrollTop;
    log(page.scrollTop === pageBefore, `左栏滚动不带动页面 [page=${pageBefore}→${page.scrollTop}]`);

    // 页面滚动不带动左栏（列固定 + 内部 scrollTop 不变）。
    box.scrollTop = 0;
    await flush();
    const colTopBefore = Math.round(col.getBoundingClientRect().top);
    const boxScrollBefore = box.scrollTop;
    page.scrollTop = 500;
    await flush();
    log(page.scrollTop > 0 && Math.round(col.getBoundingClientRect().top) === colTopBefore && box.scrollTop === boxScrollBefore,
      `页面滚动不带动左栏 [page=${page.scrollTop}, colTop ${colTopBefore}→${Math.round(col.getBoundingClientRect().top)}, boxScroll ${boxScrollBefore}→${box.scrollTop}]`);

    // 文明面板留在滚动区外，始终可见。
    log(!box.contains(col.firstElementChild), '文明面板留在滚动区外');

    // 两条滚动条同时存在，互不干扰。
    log(page.scrollHeight > 800 && box.scrollHeight > box.clientHeight,
      `页面与左栏各自拥有滚动条 [page=${page.scrollHeight}/800, box=${box.scrollHeight}/${box.clientHeight}]`);

    scroller.remove();
  }
  mounted.app.unmount();
  const protectedText = '  ' + JSON.stringify({ version: 29, original: '不可改写的旧档' }) + '\n';
  localStorage.setItem(saveKey, protectedText);
  mounted = mountGame($('#app'));
  click($('[data-tab="settings"]')); await flush();
  log(!$('#exportProtectedSave').disabled && mounted.store.runtime.saveBlocked, '保护模式启用旧存档导出按钮');
  click($('#exportProtectedSave')); await flush();
  log($('#importSaveText').value === protectedText && localStorage.getItem(saveKey) === protectedText && mounted.store.runtime.saveBlocked, '旧档原样导出到文本框，未覆盖存储或解除保护');
  click($('#hardReset')); await flush(); click($('#hardReset')); await flush();
  log($('#exportProtectedSave').disabled && !mounted.store.runtime.saveBlocked, '成功硬重置退出保护后禁用旧档导出按钮');
} catch (error) {
  log(false, `异常：${errorText(error)}`);
} finally {
  mounted?.app.unmount();
  if (saveKey && previousSave !== undefined) {
    if (previousSave === null) localStorage.removeItem(saveKey);
    else localStorage.setItem(saveKey, previousSave);
  }
  finished = true;
  render();
}
</script>
</body>
</html>
